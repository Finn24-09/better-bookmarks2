# easy-versioning configuration.
#
# Three independently versioned packages live in this repo:
#   - webapp           (React frontend, root package.json)
#   - email-service    (Fastify microservice, services/email/package.json)
#   - metadata-fetcher (Fastify microservice, services/metadata-fetcher/package.json)
#
# Each package is bumped only when files under its `triggers` change. Anything
# matched by `ignore` never causes a bump on its own.

ignore:
  - "**/*.md"
  - "docs/**"
  - ".github/**"
  - "LICENSE"
  - ".gitignore"
  - ".editorconfig"
  - ".vscode/**"

packages:
  # Frontend webapp — root package.json.
  - path: .
    triggers:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig*.json"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "components.json"

  # Email microservice — services/email/package.json.
  - path: services/email
    triggers:
      - "services/email/**"

  # Metadata-fetcher microservice — services/metadata-fetcher/package.json.
  # Scopes future URL-metadata routes (titles, favicons, OG previews) under one
  # hardened core, so any change inside the service folder bumps its version.
  - path: services/metadata-fetcher
    triggers:
      - "services/metadata-fetcher/**"
