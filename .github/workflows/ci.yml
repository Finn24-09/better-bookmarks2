name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so a series of pushes (Dependabot
# rebases, force-pushes during review) only spends CI minutes on the latest. (CR-042)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny GITHUB_TOKEN scope. Specific jobs that need write access can
# elevate locally. (DET-011)
permissions:
  contents: read

jobs:
  webapp-security-audit:
    name: Security Audit (webapp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Fail the build if any moderate-or-higher vulnerability is introduced.
      # This gate blocks Dependabot PRs that would regress security.
      - run: npm audit --audit-level=moderate

  webapp-test-and-build:
    name: Test & Build (webapp)
    runs-on: ubuntu-latest
    needs: webapp-security-audit
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  email-security-audit:
    name: Security Audit (email-service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/email
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/email/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate

  email-test-and-build:
    name: Test & Build (email-service)
    runs-on: ubuntu-latest
    needs: email-security-audit
    defaults:
      run:
        working-directory: services/email
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/email/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  metadata-fetcher-security-audit:
    name: Security Audit (metadata-fetcher)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/metadata-fetcher
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/metadata-fetcher/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate

  metadata-fetcher-test-and-build:
    name: Test & Build (metadata-fetcher)
    runs-on: ubuntu-latest
    needs: metadata-fetcher-security-audit
    defaults:
      run:
        working-directory: services/metadata-fetcher
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/metadata-fetcher/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # PR-time smoke build for each Dockerfile whose context the PR touches.
  # No push, no run — just verify the Dockerfile still builds against the
  # current source tree before main accepts the change. Multi-arch via QEMU
  # to catch arm64-only regressions before the publish-containers workflow
  # picks them up post-merge.
  #
  # The job is fanned out via a matrix so a Dockerfile-touching PR exercises
  # only the affected images. Cost: ~3 min per matched image.
  dockerfile-smoke-build:
    name: Smoke build (${{ matrix.image }})
    # Only run on pull_request — pushes to main are already covered by the
    # publish-containers workflow.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frontend
            context: .
            dockerfile: docker/frontend/Dockerfile
            # Pipe-separated extended-regex patterns of paths that should
            # trigger a frontend smoke build.
            paths: '^(docker/frontend/|src/|package(-lock)?\.json$|vite\.config\.ts$|index\.html$|tsconfig.*\.json$)'
          - image: email
            context: services/email
            dockerfile: services/email/Dockerfile
            paths: '^services/email/'
          - image: metadata-fetcher
            context: services/metadata-fetcher
            dockerfile: services/metadata-fetcher/Dockerfile
            paths: '^services/metadata-fetcher/'
          - image: db
            context: docker/db
            dockerfile: docker/db/Dockerfile
            target: production
            paths: '^docker/db/'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # need history for `git diff` against base
      # Native git-diff path filter. We intentionally do not use
      # tj-actions/changed-files — it has a documented supply-chain compromise
      # history, and giving any third-party action a chance to run on PRs is
      # an unnecessary widening of the CI trust surface for what is one
      # `git diff` command. (See spec §11.3 on action-pinning policy.)
      - id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PATHS: ${{ matrix.paths }}
        run: |
          set -euo pipefail
          # `${BASE_SHA}...HEAD` is the standard PR diff range. The regex is
          # ERE (grep -E); failures fall through to "no match" → skip.
          if git diff --name-only "${BASE_SHA}...HEAD" | grep -E "$PATHS" >/dev/null; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip if no relevant changes
        if: steps.changed.outputs.any_changed != 'true'
        run: echo "::notice::No changes under ${{ matrix.image }} build context — skipping smoke build"
      - uses: docker/setup-qemu-action@v3
        if: steps.changed.outputs.any_changed == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.changed.outputs.any_changed == 'true'
      - name: Smoke build (multi-arch, no push)
        if: steps.changed.outputs.any_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: false
          # GHA cache keyed per-image so concurrent smoke builds across PRs
          # do not collide.
          cache-from: type=gha,scope=smoke-${{ matrix.image }}
          cache-to: type=gha,scope=smoke-${{ matrix.image }},mode=max
