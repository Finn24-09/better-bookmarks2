name: Claude Code

# Two owner-only commands, both via issue/PR comments:
#   - "@claude review" on an open pull request -> Claude reviews the PR
#   - "@claude pr"     on an open issue        -> Claude opens a PR from the
#                                                 issue's linked development
#                                                 branch
#
# author_association == 'OWNER' restricts both commands to the repository
# owner; comments from collaborators, members, or strangers cannot trigger
# Claude.
#
# Both jobs run the action in agent mode (we provide a prompt:). Agent mode
# does not auto-allow shell tools and does not post a tracking comment, so
# each job must:
#   1. Pass --allowedTools in claude_args so Claude can run gh/git.
#   2. Cap runtime via timeout-minutes and --max-turns to prevent runaway
#      cost when the agent thrashes against permission denials or other
#      unexpected failures.

on:
  issue_comment:
    types: [created]

jobs:
  pr-review:
    name: Review pull request on @claude review
    if: |
      github.event.issue.pull_request != null &&
      github.event.issue.state == 'open' &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '@claude review')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude code review
        id: claude
        # Pinned to v1.0.112 -- v1.0.113 ships Claude Code 2.1.129, whose installer
        # reports success but does not place the binary at ~/.local/bin/claude,
        # causing the plugin marketplace add step to fail with ENOENT.
        # See https://github.com/anthropics/claude-code-action/issues/1290.
        # Revisit once upstream ships a fix and bump back to @v1.
        uses: anthropics/claude-code-action@2cc1ac1331eac7a6a96d716dd204dd2888d0fcd2 # v1.0.112
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Glob,Grep,LS,Bash(gh:*),Bash(git:*)"
          prompt: |
            Review pull request #${{ github.event.issue.number }} in ${{ github.repository }}.
            Focus on correctness, security, maintainability, and test coverage.

            Use `gh pr view ${{ github.event.issue.number }}` and
            `gh pr diff ${{ github.event.issue.number }}` to read the PR.

            Post exactly one summary comment on the PR via
            `gh pr comment ${{ github.event.issue.number }} --body "<MARKDOWN>"`.
            That single comment is the entire review output.

            Do NOT post inline review comments (no `gh api .../pulls/.../reviews`,
            no `gh pr review`); fold any per-file or per-line observations into
            the summary instead, citing file paths and line numbers in prose.
            Do not approve or merge the PR.

  issue-to-pr:
    name: Open PR from issue on @claude pr
    if: |
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '@claude pr')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: React to trigger comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api -X POST \
            "repos/$REPO/issues/comments/$COMMENT_ID/reactions" \
            -f content=eyes >/dev/null

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude open-PR-from-issue
        id: claude
        # Pinned to v1.0.112 -- see comment on pr-review job above.
        uses: anthropics/claude-code-action@2cc1ac1331eac7a6a96d716dd204dd2888d0fcd2 # v1.0.112
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 25
            --allowedTools "Read,Glob,Grep,LS,Bash(gh:*),Bash(git:*)"
          prompt: |
            Repo:   ${{ github.repository }}
            Issue:  #${{ github.event.issue.number }}
            Base:   ${{ github.event.repository.default_branch }}

            Open a PR from the development branch linked to issue
            #${{ github.event.issue.number }} into ${{ github.event.repository.default_branch }}.

            1. `gh issue develop --list ${{ github.event.issue.number }}` -> find the linked branch <BRANCH>.
               - No branch linked: `gh issue comment ${{ github.event.issue.number }} --body "No development branch is linked to this issue."` and stop.
               - Branch has 0 commits ahead of ${{ github.event.repository.default_branch }}
                 (`git rev-list --count origin/${{ github.event.repository.default_branch }}..origin/<BRANCH>`):
                 `gh issue comment ${{ github.event.issue.number }} --body "Branch <BRANCH> has no commits ahead of ${{ github.event.repository.default_branch }}."` and stop.

            2. Read the issue (title, body, labels) and the diff:
                 `gh issue view ${{ github.event.issue.number }} --json title,body,labels`
                 `git diff origin/${{ github.event.repository.default_branch }}...origin/<BRANCH>`

            3. Create the PR, copying every label from the issue onto the new PR
               (one --label flag per label name; omit --label entirely if the
               issue has no labels):
                 `gh pr create --base ${{ github.event.repository.default_branch }} --head <BRANCH> --title "<issue title>" --label "<L1>" --label "<L2>" --body "<BODY>"`
               <BODY> must:
                 (a) restate the problem/goal from the issue;
                 (b) summarise what actually changed in the diff -- group by area for
                     large diffs, name key files/functions; never invent changes not
                     present in the diff;
                 (c) flag anything reviewers should look at closely (security-sensitive
                     code, breaking behaviour, test coverage gaps);
                 (d) end with "Closes #${{ github.event.issue.number }}".

            Do NOT post any confirmation comment on the issue after the PR is
            opened. With "Closes #${{ github.event.issue.number }}" in the body,
            GitHub auto-records the PR in the issue's timeline -- an extra
            "Opened <URL>" comment is just noise.
