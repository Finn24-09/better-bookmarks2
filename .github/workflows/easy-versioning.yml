name: easy-versioning

on:
  push:
    branches: [main]

concurrency:
  group: easy-versioning-${{ github.ref }}
  cancel-in-progress: false

# actions/checkout below needs contents: read to clone the repo. The
# easy-versioning action itself does NOT use GITHUB_TOKEN — it authenticates
# as a GitHub App via app-id + private-key and mints its own short-lived
# installation token for pushing the bump commit. So contents: read is the
# only permission this workflow grants.
permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: Finn24-09/easy-versioning@v1
        with:
          app-id: ${{ secrets.EASY_VERSIONING_APP_ID }}
          private-key: ${{ secrets.EASY_VERSIONING_PRIVATE_KEY }}
