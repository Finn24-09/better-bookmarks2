# Development overrides — applied automatically by `docker compose up`.
#
# Effect: re-introduces the `build:` directives so developers continue to
# build images locally. When both `image:` (from docker-compose.yml) and
# `build:` (here) are present, `docker compose build` tags the local build
# with the `image:` name, and `docker compose up` prefers the local image
# over a remote pull.
#
# Production deployments must skip this file:
#   docker compose -f docker-compose.yml up -d

services:
  db:
    build:
      context: ./docker/db
      dockerfile: Dockerfile
      target: dev          # includes pgTAP for database unit tests

  postgrest:
    ports:
      - "3000:3000"        # expose for Vite dev proxy (npm run dev)

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile

  email-service:
    build:
      context: ./services/email
      dockerfile: Dockerfile
    ports:
      - "5001:5001"  # expose for Vite dev proxy (npm run dev)

  metadata-fetcher:
    build:
      context: ./services/metadata-fetcher
      dockerfile: Dockerfile
    ports:
      - "5002:5002"  # expose for Vite dev proxy (npm run dev)

  # Run with: docker compose --profile adminer up
  adminer:
    image: adminer:4.8.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    profiles:
      - adminer
    networks:
      - betterbookmarks2

  # Run with: docker compose run --rm test
  test:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./docker/db/tests:/tests:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        psql -v ON_ERROR_STOP=0 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -f /tests/migration_state.sql
        psql -v ON_ERROR_STOP=0 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -f /tests/tests.sql
    profiles:
      - test
    networks:
      - betterbookmarks2
