services:
  db:
    build:
      context: ./docker/db
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      PGRST_DB_URI:                  postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMA:               api
      PGRST_DB_ANON_ROLE:            anon
      PGRST_JWT_SECRET:              ${PGRST_JWT_SECRET}
      # Injects the secret as app.settings.jwt_secret GUC so SQL functions
      # (sign_up, sign_in) can call current_setting('app.settings.jwt_secret').
      PGRST_APP_SETTINGS_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_DB_POOL:                 10
      PGRST_SERVER_PORT:             3000
      PGRST_DB_EXTRA_SEARCH_PATH:    auth
    # No ports: PostgREST is on the internal network only.
    # nginx proxies /api/* → postgrest:3000 for all external traffic.

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgrest
    ports:
      - "80:80"

volumes:
  db_data:
