networks:
  betterbookmarks2:
    name: betterbookmarks2
    driver: bridge

services:
  db:
    build:
      context: ./docker/db
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # PostgreSQL requires CHOWN/FOWNER/SETUID/SETGID/DAC_OVERRIDE for socket
    # and data directory management — cannot drop these.
    cap_drop:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_PTRACE
      - AUDIT_WRITE
      - MKNOD
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    networks:
      - betterbookmarks2

  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      PGRST_DB_URI:                  postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMA:               api
      PGRST_DB_ANON_ROLE:            anon
      PGRST_JWT_SECRET:              ${PGRST_JWT_SECRET}
      # Injects the secret as app.settings.jwt_secret GUC so SQL functions
      # (sign_up, sign_in) can call current_setting('app.settings.jwt_secret').
      PGRST_APP_SETTINGS_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_DB_POOL:                 10
      PGRST_SERVER_PORT:             3000
      PGRST_DB_EXTRA_SEARCH_PATH:    auth
    # No ports: PostgREST is on the internal network only.
    # nginx proxies /api/* → postgrest:3000 for all external traffic.
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    networks:
      - betterbookmarks2

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgrest
    ports:
      - "80:80"
    # nginx needs NET_BIND_SERVICE to listen on port 80.
    # nginx needs CHOWN to set ownership on its tmpfs cache dirs at startup
    # (chowns /var/cache/nginx/client_temp to uid 101). With read_only: true
    # this capability is constrained to the writable tmpfs mounts only.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # bind port 80
      - CHOWN             # chown /var/cache/nginx/client_temp to uid 101 at startup
      - SETGID            # master → worker privilege drop: setgid(101)
      - SETUID            # master → worker privilege drop: setuid(101)
    read_only: true
    tmpfs:
      # nginx writes request temp files here; CHOWN capability allows the
      # startup chown of client_temp to uid 101 (nginx worker user).
      - /var/cache/nginx
      # Alpine Linux: /var/run → /run (symlink). nginx writes its PID to
      # /run/nginx.pid, so /run must be the writable tmpfs, not /var/run.
      - /run
      # NOTE: /var/log/nginx is intentionally NOT a tmpfs. The official nginx
      # image symlinks access.log → /dev/stdout and error.log → /dev/stderr so
      # that Docker captures nginx output. Mounting a tmpfs there would replace
      # those symlinks with an empty directory, making nginx errors invisible.
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"
    networks:
      - betterbookmarks2

volumes:
  db_data:
