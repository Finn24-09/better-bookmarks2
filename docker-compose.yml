networks:
  betterbookmarks2:
    name: betterbookmarks2
    driver: bridge
  # Dedicated network for the metadata-fetcher. The fetcher is the only
  # service in the deployment that dials user-supplied URLs, so an SSRF
  # bypass or a CVE in its HTTP / parser stack must NOT have an L3 path to
  # `db` or `postgrest`. Only `frontend` (nginx) bridges both networks so it
  # can reverse-proxy /api/title/ to the fetcher. `internal: false` because
  # the fetcher legitimately needs outbound internet access.
  metadata_net:
    name: metadata_net
    driver: bridge
    internal: false

services:
  db:
    build:
      context: ./docker/db
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # PostgreSQL requires CHOWN/FOWNER/SETUID/SETGID/DAC_OVERRIDE for socket
    # and data directory management — cannot drop these.
    cap_drop:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_PTRACE
      - AUDIT_WRITE
      - MKNOD
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    networks:
      - betterbookmarks2

  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      PGRST_DB_URI:                  postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMA:               api
      PGRST_DB_ANON_ROLE:            anon
      PGRST_JWT_SECRET:              ${PGRST_JWT_SECRET}
      # Injects the secret as app.settings.jwt_secret GUC so SQL functions
      # (sign_up, sign_in) can call current_setting('app.settings.jwt_secret').
      PGRST_APP_SETTINGS_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_DB_POOL:                 10
      PGRST_SERVER_PORT:             3000
      PGRST_DB_EXTRA_SEARCH_PATH:    auth
      # Pre-request hook validates JWT token_version to enable session invalidation
      # after password reset or change (see 08_email_tokens.sql).
      PGRST_DB_PRE_REQUEST:          api.check_token_version
    # No ports: PostgREST is on the internal network only.
    # nginx proxies /api/* → postgrest:3000 for all external traffic.
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    networks:
      - betterbookmarks2

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgrest
    ports:
      - "80:80"
    # nginx needs NET_BIND_SERVICE to listen on port 80.
    # nginx needs CHOWN to set ownership on its tmpfs cache dirs at startup
    # (chowns /var/cache/nginx/client_temp to uid 101). With read_only: true
    # this capability is constrained to the writable tmpfs mounts only.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # bind port 80
      - CHOWN             # chown /var/cache/nginx/client_temp to uid 101 at startup
      - SETGID            # master → worker privilege drop: setgid(101)
      - SETUID            # master → worker privilege drop: setuid(101)
    read_only: true
    tmpfs:
      # nginx writes request temp files here; CHOWN capability allows the
      # startup chown of client_temp to uid 101 (nginx worker user).
      - /var/cache/nginx
      # Alpine Linux: /var/run → /run (symlink). nginx writes its PID to
      # /run/nginx.pid, so /run must be the writable tmpfs, not /var/run.
      - /run
      # NOTE: /var/log/nginx is intentionally NOT a tmpfs. The official nginx
      # image symlinks access.log → /dev/stdout and error.log → /dev/stderr so
      # that Docker captures nginx output. Mounting a tmpfs there would replace
      # those symlinks with an empty directory, making nginx errors invisible.
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"
    networks:
      - betterbookmarks2
      - metadata_net          # nginx reverse-proxies /api/title/ to metadata-fetcher

  email-service:
    build:
      context: ./services/email
      dockerfile: Dockerfile
    container_name: bb2-email
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "5001"
      EMAIL_DATABASE_URL: "postgres://email_svc:${EMAIL_DB_PASSWORD}@db:5432/${POSTGRES_DB}"
      # Shares the PostgREST JWT secret so the service can verify user tokens.
      # The email service uses jose with an explicit HS256 algorithm whitelist —
      # it cannot forge tokens (it only verifies), but the shared secret means a
      # compromised email service container could theoretically forge JWTs.
      # Mitigation: keep the email service network-isolated (no external ports).
      JWT_SECRET: "${PGRST_JWT_SECRET}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM: "${SMTP_FROM}"
      APP_BASE_URL: "${APP_BASE_URL}"
      AWS_SES_REGION: "${AWS_SES_REGION:-}"
      AWS_SES_CONFIGURATION_SET: "${AWS_SES_CONFIGURATION_SET:-}"
      AWS_SES_FROM_ARN: "${AWS_SES_FROM_ARN:-}"
      COOKIE_SECRET: "${COOKIE_SECRET}"
    depends_on:
      db:
        condition: service_healthy
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"
    networks:
      - betterbookmarks2
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  metadata-fetcher:
    build:
      context: ./services/metadata-fetcher
      dockerfile: Dockerfile
    container_name: bb2-metadata-fetcher
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "5002"
      # Shares the PostgREST JWT secret so the service can verify user
      # tokens. The service runs jose with an explicit HS256 algorithm
      # whitelist — it cannot forge tokens (it only verifies). A
      # compromised metadata-fetcher container could theoretically forge
      # JWTs, mitigated by the dedicated `metadata_net` network: even with
      # a forged token the container has no L3 path to db / postgrest.
      JWT_SECRET: "${PGRST_JWT_SECRET}"
      JWT_AUDIENCE: "metadata-svc"
      LOG_LEVEL: "info"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          # 256 MiB accommodates the 2 MiB body cap (operator-overridable up
          # to 8 MiB via MAX_BODY_BYTES) under 32 concurrent in-flight reads,
          # plus Node + Fastify + htmlparser2 + prom-client baseline.
          memory: 256m
          cpus: "0.5"
    networks:
      - metadata_net           # only network — no L3 reach to db or postgrest
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  db_data:
