services:
  db:
    build:
      context: ./docker/db
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
      - ./docker/db/tests:/tests:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMA: api
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      # Expose the JWT secret as app.settings.jwt_secret GUC inside every DB
      # transaction so that SQL functions (sign_up, sign_in) can call
      # current_setting('app.settings.jwt_secret') to sign tokens with pgjwt.
      # PGRST_JWT_SECRET alone only covers PostgREST's own token verification;
      # PGRST_APP_SETTINGS_* is the separate mechanism that injects arbitrary
      # settings into the database session (PostgREST docs: "Extra Configuration").
      PGRST_APP_SETTINGS_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_DB_POOL: 10
      PGRST_SERVER_PORT: 3000
      PGRST_DB_EXTRA_SEARCH_PATH: auth
    ports:
      - "3000:3000"

  # Run with: docker compose --profile adminer up
  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    profiles:
      - adminer

  # Run with: docker compose run --rm test
  test:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./docker/db/tests:/tests:ro
    entrypoint: []
    command: >
      psql
        -v ON_ERROR_STOP=0
        -h db
        -U ${POSTGRES_USER}
        -d ${POSTGRES_DB}
        -f /tests/tests.sql
    profiles:
      - test

volumes:
  db_data:
