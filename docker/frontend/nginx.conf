# Rate limiting zones — at the http context level (this file is included
# inside nginx's http {} block via conf.d/).
# Sign-in gets the tightest limit: 5 attempts/min per IP stops brute force
# while allowing a human who mis-types a password a couple of retries.
limit_req_zone $binary_remote_addr zone=signin:10m        rate=5r/m;
limit_req_zone $binary_remote_addr zone=signup:10m        rate=10r/m;
# Authenticated mutations that touch credentials — rate-limit to prevent
# brute-force of change_password and protect delete_account from abuse.
limit_req_zone $binary_remote_addr zone=auth_mutation:10m rate=5r/m;
# Export reads many paginated rows + thumbnail blobs — cap at 60 req/min per IP
# to prevent session-hijack exfiltration loops from exhausting the DB pool.
limit_req_zone $binary_remote_addr zone=api_read:10m      rate=60r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Reject request bodies larger than 2 MB.
    # Client-side compression targets ~50-100 KB for thumbnails; 2 MB gives
    # ample headroom while preventing large-payload DoS against PostgREST/DB.
    client_max_body_size 2M;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers — delivered as HTTP headers so they apply before any
    # HTML is parsed and cannot be stripped by an injected <meta> tag.
    add_header X-Frame-Options         "DENY"                                                                                                                 always;
    add_header X-Content-Type-Options  "nosniff"                                                                                                              always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"                                                                                      always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(), payment=()"                                                                  always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # HSTS: instruct browsers to only connect via HTTPS for 1 year.
    # Only effective when TLS is active on the upstream reverse proxy.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate-limited auth RPCs.
    # Exact-match locations take precedence over the wildcard /api/ block.
    location = /api/rpc/sign_in {
        limit_req        zone=signin burst=3 nodelay;
        limit_req_status 429;

        proxy_pass         http://postgrest:3000/rpc/sign_in;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /api/rpc/sign_up {
        limit_req        zone=signup burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://postgrest:3000/rpc/sign_up;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Rate-limited credential-mutation RPCs.
    # Must appear before the wildcard /api/ block so exact-match takes precedence.
    location = /api/rpc/change_password {
        limit_req        zone=auth_mutation burst=2 nodelay;
        limit_req_status 429;

        proxy_pass         http://postgrest:3000/rpc/change_password;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    location = /api/rpc/delete_account {
        limit_req        zone=auth_mutation burst=2 nodelay;
        limit_req_status 429;

        proxy_pass         http://postgrest:3000/rpc/delete_account;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Rate-limit export data endpoints: bookmark pages + thumbnail images.
    # Exact-match auth locations above take precedence; this catches export traffic.
    location ~ ^/api/(bookmarks_with_tags|thumbnail_images) {
        limit_req        zone=api_read burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://postgrest:3000/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # General API proxy — strips /api prefix, forwards to PostgREST on the internal network.
    location /api/ {
        proxy_pass         http://postgrest:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # SPA fallback — unmatched paths return index.html so React Router handles them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for Vite's content-hashed static assets.
    location ~* \.(js|css|woff2?|svg|png|ico)$ {
        expires 1y;
    }
}
