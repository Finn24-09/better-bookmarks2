server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (supplement the <meta> headers already in index.html)
    add_header X-Frame-Options          "DENY"                            always;
    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # API proxy — strips /api prefix, forwards to PostgREST on the internal network
    location /api/ {
        proxy_pass         http://postgrest:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # SPA fallback — unmatched paths return index.html so React Router handles them
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for Vite's content-hashed static assets.
    # Uses `expires` (not add_header) so the server-block security headers
    # are still inherited by this location block.
    location ~* \.(js|css|woff2?|svg|png|ico)$ {
        expires 1y;
    }
}
