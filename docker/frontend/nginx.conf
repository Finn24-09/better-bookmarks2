# Rate limiting zones — at the http context level (this file is included
# inside nginx's http {} block via conf.d/).
# Sign-in gets the tightest limit: 5 attempts/min per IP stops brute force
# while allowing a human who mis-types a password a couple of retries.
limit_req_zone $binary_remote_addr zone=signin:10m        rate=5r/m;
limit_req_zone $binary_remote_addr zone=signup:10m        rate=10r/m;
# Authenticated mutations that touch credentials — rate-limit to prevent
# brute-force of change_password and protect delete_account from abuse.
limit_req_zone $binary_remote_addr zone=auth_mutation:10m rate=5r/m;
# Export reads many paginated rows + thumbnail blobs — cap at 60 req/min per IP
# to prevent session-hijack exfiltration loops from exhausting the DB pool.
limit_req_zone $binary_remote_addr zone=api_read:10m      rate=60r/m;

# Email service rate-limit zones
limit_req_zone $binary_remote_addr zone=email_reset:10m   rate=3r/m;
limit_req_zone $binary_remote_addr zone=email_verify:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=email_delete_req:10m     rate=2r/m;
limit_req_zone $binary_remote_addr zone=email_delete_confirm:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=email_resend:10m  rate=3r/m;
limit_req_zone $binary_remote_addr zone=email_notify:10m  rate=10r/m;

# Metadata-fetcher (auto-fill title) rate-limit zone — matches the service-side
# 30r/m per-user cap. Per-IP enforcement here is defence-in-depth against an
# unauthenticated flood: a single source IP cannot exhaust the service before
# JWT verification rejects the request.
limit_req_zone $binary_remote_addr zone=title_fetch:10m rate=30r/m;

# H-3: scrub token query params from access log. Extended to cover /api/title/
# so the access log never carries the inbound URL query — same posture as
# /api/email/.
map $request_uri $uri_scrubbed {
    ~^(/api/email/[^?]+)  $1;
    ~^(/api/title/[^?]+)  $1;
    default               $request_uri;
}
log_format email_scrubbed '$remote_addr [$time_local] "$request_method $uri_scrubbed $server_protocol" $status';

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Reject request bodies larger than 2 MB.
    # Client-side compression targets ~50-100 KB for thumbnails; 2 MB gives
    # ample headroom while preventing large-payload DoS against PostgREST/DB.
    client_max_body_size 2M;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers — delivered as HTTP headers so they apply before any
    # HTML is parsed and cannot be stripped by an injected <meta> tag.
    add_header X-Frame-Options         "DENY"                                                                                                                 always;
    add_header X-Content-Type-Options  "nosniff"                                                                                                              always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"                                                                                      always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(), payment=()"                                                                  always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # HSTS: instruct browsers to only connect via HTTPS for 1 year.
    # Only effective when TLS is active on the upstream reverse proxy.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate-limited auth RPCs.
    # Exact-match locations take precedence over the wildcard /api/ block.
    location = /api/rpc/sign_in {
        limit_req        zone=signin burst=3 nodelay;
        limit_req_status 429;

        proxy_pass         http://postgrest:3000/rpc/sign_in;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /api/rpc/sign_up {
        limit_req        zone=signup burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://postgrest:3000/rpc/sign_up;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Rate-limited credential-mutation RPCs.
    # Must appear before the wildcard /api/ block so exact-match takes precedence.
    location = /api/rpc/change_password {
        limit_req        zone=auth_mutation burst=2 nodelay;
        limit_req_status 429;

        proxy_pass         http://postgrest:3000/rpc/change_password;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    location = /api/rpc/delete_account {
        # Legacy direct-delete RPC revoked — email-confirmed flow is the only permitted path.
        return 404;
    }

    # Rate-limit export data endpoints: bookmark pages + thumbnail images.
    # Exact-match auth locations above take precedence; this catches export traffic.
    location ~ ^/api/(bookmarks_with_tags|thumbnail_images) {
        limit_req        zone=api_read burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://postgrest:3000/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Email service endpoints ──────────────────────────────────────────────
    # All blocks use the scrubbed log format (H-3) and forward client IP headers.

    location = /api/email/request-reset {
        access_log /var/log/nginx/access.log email_scrubbed;
        limit_req        zone=email_reset burst=2 nodelay;
        limit_req_status 429;
        add_header       Retry-After 20 always;
        limit_except POST { deny all; }
        proxy_pass         http://email-service:5001/request-reset;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        proxy_read_timeout 5s;
    }

    location = /api/email/reset-password {
        access_log /var/log/nginx/access.log email_scrubbed;
        limit_except GET { deny all; }
        proxy_pass         http://email-service:5001/reset-password;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
    }

    location = /api/email/confirm-reset {
        access_log /var/log/nginx/access.log email_scrubbed;
        limit_req        zone=email_reset burst=2 nodelay;
        limit_req_status 429;
        add_header       Retry-After 20 always;
        limit_except POST { deny all; }
        proxy_pass         http://email-service:5001/confirm-reset;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location = /api/email/verify-email {
        access_log /var/log/nginx/access.log email_scrubbed;
        limit_req        zone=email_verify burst=5 nodelay;
        limit_req_status 429;
        limit_except GET { deny all; }
        proxy_pass         http://email-service:5001/verify-email;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
    }

    location = /api/email/resend-verification {
        access_log /var/log/nginx/access.log email_scrubbed;
        limit_req        zone=email_resend burst=2 nodelay;
        limit_req_status 429;
        add_header       Retry-After 20 always;
        limit_except POST { deny all; }
        proxy_pass         http://email-service:5001/resend-verification;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        proxy_read_timeout 5s;
    }

    location = /api/email/request-delete {
        access_log /var/log/nginx/access.log email_scrubbed;
        limit_req        zone=email_delete_req burst=1 nodelay;
        limit_req_status 429;
        add_header       Retry-After 30 always;
        limit_except POST { deny all; }
        proxy_pass         http://email-service:5001/request-delete;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        proxy_read_timeout 5s;
    }

    location = /api/email/confirm-delete {
        access_log /var/log/nginx/access.log email_scrubbed;
        limit_req        zone=email_delete_confirm burst=3 nodelay;
        limit_req_status 429;
        add_header       Retry-After 12 always;
        limit_except POST { deny all; }
        proxy_pass         http://email-service:5001/confirm-delete;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        proxy_read_timeout 15s;
    }

    location = /api/email/notify-password-change {
        access_log /var/log/nginx/access.log email_scrubbed;
        limit_req        zone=email_notify burst=5 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        proxy_pass         http://email-service:5001/notify-password-change;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        proxy_read_timeout 5s;
    }

    location = /api/email/refresh-after-verify {
        access_log /var/log/nginx/access.log email_scrubbed;
        # The email-service-side cap is 3/min/user (rateLimit.ts:68). This
        # zone is defence-in-depth: a single source IP can't drive more than
        # 5/min even before JWT verification. Burst small — this is a
        # one-shot route fired immediately after email verification.
        limit_req        zone=email_resend burst=2 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        proxy_pass         http://email-service:5001/refresh-after-verify;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        proxy_read_timeout 5s;
    }

    # Block all other /api/email/* paths (health checks, undocumented endpoints)
    location ^~ /api/email/ {
        return 404;
    }

    # ── Metadata-fetcher (auto-fill title) endpoint ─────────────────────────
    # Single exact-match route. The service's /health and /metrics endpoints
    # exist for the container healthcheck and operator metrics scrape but
    # MUST NOT be reachable from outside the deployment — the wildcard 404
    # below catches everything else under /api/title/.

    # Reject /api/title without trailing slash explicitly so the request
    # never falls through to the generic /api/ proxy block (which would
    # have forwarded to PostgREST as /title). The only legitimate form is
    # POST /api/title/ (with trailing slash); anything else 404s.
    location = /api/title {
        return 404;
    }

    location = /api/title/ {
        access_log /var/log/nginx/access.log email_scrubbed;
        limit_req        zone=title_fetch burst=5 nodelay;
        limit_req_status 429;
        add_header       Retry-After 2 always;
        # Cross-Origin-Resource-Policy: same-origin makes the response opaque
        # to any cross-origin embedder (defence in depth — the endpoint is
        # bearer-protected anyway). Vary: Origin keeps proxy caches honest.
        add_header       Cross-Origin-Resource-Policy "same-origin" always;
        add_header       Vary "Origin" always;
        limit_except POST { deny all; }
        proxy_pass         http://metadata-fetcher:5002/title;
        proxy_http_version 1.1;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        proxy_read_timeout 8s;
        proxy_send_timeout 5s;
        client_max_body_size 4k;
    }

    # Block /api/title/anything-else (covers /health, /metrics, and any future
    # internal-only route accidentally added to the service).
    location ^~ /api/title/ {
        return 404;
    }

    # General API proxy — strips /api prefix, forwards to PostgREST on the internal network.
    location /api/ {
        proxy_pass         http://postgrest:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # SPA fallback — unmatched paths return index.html so React Router handles them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for Vite's content-hashed static assets.
    location ~* \.(js|css|woff2?|svg|png|ico)$ {
        expires 1y;
    }
}
